services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: neovault
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neovault
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]
    
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686"]
    
volumes:
  pgdata: